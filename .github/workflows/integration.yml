name: Integration Test
on:
  push:
    branches:
    - '*'
    paths-ignore:
    - 'docs/**'
    - '**/README.md'
    tags-ignore:
    - '*.*'
  pull_request:
    types: [opened, reopened]
permissions: {}
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
      - name: Self test
        id: selftest

        uses: ribtoks/tdg-github-action@2e71a53c3aae01ab7196b87f3575739462cb507d # master
        with:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          DRY_RUN: 1
          EXCLUDE_PATTERN: "\\.*/vendor/"
      - name: Check outputs
        env:
          SCANNED_ISSUES: ${{ steps.selftest.outputs.scannedIssues }}
        run: |
          test "$SCANNED_ISSUES" == "1"
