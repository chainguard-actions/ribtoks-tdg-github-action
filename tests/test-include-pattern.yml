name: Test include pattern filtering
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source files with TODO comments
        run: |
          mkdir -p "$GITHUB_WORKSPACE/src"
          cat > "$GITHUB_WORKSPACE/src/main.go" << 'EOF'
          package main

          // TODO: implement this feature properly with full test coverage
          func main() {}
          EOF
          cat > "$GITHUB_WORKSPACE/src/notes.txt" << 'EOF'
          TODO: this text file todo should be excluded by include pattern
          EOF

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROOT: "."
          DRY_RUN: "1"
          REF: "refs/heads/act-harness"
          SHA: ${{ github.sha }}
          LABEL: "todo comment"
          INCLUDE_PATTERN: "\\.go$"
          MIN_WORDS: "3"
          MIN_CHARACTERS: "30"
          EXTENDED_LABELS: "0"

      - name: Assert action ran (dry-run with include pattern or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with include pattern in dry-run mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
