name: Test minimum words and characters thresholds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source file with TODO comments of varying lengths
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/threshold-src"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/threshold-src/sample.go" << 'EOF'
          package main

          // TODO: short
          // TODO: This is a longer todo comment that meets the minimum word and character requirements
          func main() {
              println("hello world")
          }
          EOF

      - id: action
        uses: .
        with:
          REPO: "actions/checkout"
          ISSUE_REPO: "actions/checkout"
          TOKEN: ${{ github.token }}
          ROOT: "tests/fixtures/threshold-src"
          DRY_RUN: "1"
          MIN_WORDS: "5"
          MIN_CHARACTERS: "40"
          REF: "refs/heads/act-harness"
          SHA: ${{ github.sha }}
          LABEL: "todo comment"
          EXTENDED_LABELS: "0"

      - name: Assert scannedIssues output is set
        env:
          SCANNED: ${{ steps.action.outputs.scannedIssues }}
        run: |
          echo "scannedIssues: $SCANNED"
          if [ "$SCANNED" != "1" ]; then
            echo "FAIL: expected scannedIssues=1 but got '$SCANNED'"
            exit 1
          fi
          echo "PASS: scannedIssues=1 with min thresholds applied"
