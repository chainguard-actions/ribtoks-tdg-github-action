name: Test action builds binary
on:
  workflow_dispatch:
jobs:
  test-build:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          REPO: "owner/repo"
          TOKEN: "fake-token-for-build-test"
          DRY_RUN: "1"
          ROOT: "."
          REF: "refs/heads/main"
          SHA: "abc123"
          SETUP_GO_CACHE: "false"

      - name: Assert action ran (not skipped)
        run: |
          OUTCOME="${{ steps.action.outcome }}"
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped entirely"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"

      - name: Assert binary was built
        run: |
          echo "Searching for tdg-github-action binary..."
          FOUND=$(find / -name "tdg-github-action" -type f 2>/dev/null | head -5 || true)
          echo "Found: $FOUND"
          if [ -z "$FOUND" ]; then
            echo "FAIL: tdg-github-action binary not found anywhere"
            exit 1
          fi
          echo "PASS: binary found at $FOUND"
